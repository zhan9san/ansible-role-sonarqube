---
- name: Ensure SonarQube install directory exists
  ansible.builtin.file:
    path: "{{ sonarqube_install_dir }}"
    state: directory
    mode: "0755"

- name: Upload Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ sonarqube_install_dir }}/docker-compose.yml"
    mode: "0644"

- name: Upload Docker Compose env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ sonarqube_install_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Start SonarQube
  community.docker.docker_compose_v2:
    project_src: "{{ sonarqube_install_dir }}"
    pull: missing
    remove_orphans: true

- name: Wait for SonarQube to start
  ansible.builtin.uri:
    url: "{{ __sonarqube_local_url }}/api/system/status"
  register: sonarqube_status
  until: sonarqube_status.json.status | default('') in ['UP', 'DB_MIGRATION_NEEDED']
  retries: "{{ sonarqube_wait_retries }}"
  delay: "{{ sonarqube_wait_delay }}"

- name: Migrate the database
  when: sonarqube_status.json.status == 'DB_MIGRATION_NEEDED'
  block:
    - name: Start the database migration
      ansible.builtin.uri:
        url: "{{ __sonarqube_local_url }}/api/system/migrate_db"
        method: POST
      changed_when: true

    - name: Wait for the database migration
      ansible.builtin.uri:
        url: "{{ __sonarqube_local_url }}/api/system/status"
      register: sonarqube_migration_status
      until: sonarqube_migration_status.json.status | default('') == 'UP'
      retries: "{{ sonarqube_wait_retries }}"
      delay: "{{ sonarqube_wait_delay }}"
